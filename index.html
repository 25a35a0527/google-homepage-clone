<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Google Clone</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      flex-direction:column;
      background:white;
    }

    /* Header */
    header{
      padding:20px;
    }

    nav{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:20px;
    }

    nav a{
      text-decoration:none;
      color:black;
      font-size:14px;
    }

    nav a:hover{
      text-decoration:underline;
    }

    .signin-btn{
      background:#1a73e8;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:5px;
      cursor:pointer;
      font-size:14px;
    }

    .signin-btn:hover{
      background:#1669c1;
    }

    /* Main */
    main{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      margin-top:-80px;
    }

    .logo{
      font-size:90px;
      font-weight:bold;
      margin-bottom:30px;
    }

    .search-box{
      width:100%;
      display:flex;
      justify-content:center;
    }

    .search-box input{
      width:550px;
      padding:15px 20px;
      border-radius:30px;
      border:1px solid #dcdcdc;
      outline:none;
      font-size:16px;
    }

    .search-box input:hover{
      box-shadow:0 1px 6px rgba(32,33,36,0.28);
    }

    .buttons{
      margin-top:30px;
    }

    .buttons button{
      padding:10px 20px;
      margin:5px;
      border:none;
      background:#f8f9fa;
      border-radius:5px;
      cursor:pointer;
      font-size:14px;
    }

    .buttons button:hover{
      border:1px solid #ccc;
    }

    /* Footer */
    footer{
      background:#f2f2f2;
      padding:15px 30px;
      font-size:14px;
      color:#555;
    }

    /* Responsive */
    @media(max-width:600px){

      .logo{
        font-size:60px;
      }

      .search-box input{
        width:90%;
      }

      .buttons{
        display:flex;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <nav>
      <a href="#">Gmail</a>
      <a href="#">Images</a>
      <button class="signin-btn">Sign in</button>
    </nav>
  </header>

  <!-- Main -->
  <main>

    <h1 class="logo">
      <span style="color:#4285F4;">G</span>
      <span style="color:#EA4335;">o</span>
      <span style="color:#FBBC05;">o</span>
      <span style="color:#4285F4;">g</span>
      <span style="color:#34A853;">l</span>
      <span style="color:#EA4335;">e</span>
    </h1>

    <div class="search-box">
      <input type="text" placeholder="Search Google or type a URL">
    </div>

    <div class="buttons">
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    India
  </footer>

</body>
</html>
